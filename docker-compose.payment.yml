# Tenth overlay. Only Payment API receives the merchant signing secret.
services:
  gateway:
    environment:
      GATEWAY_UPSTREAMS: '{"ai":"http://ai-service:8082","review":"http://review-service:8083","identity":"http://identity-service:8084","catalog":"http://catalog-service:8085","cinema":"http://cinema-service:8086","booking":"http://booking-service:8087","payment":"http://payment-service:8088"}'
  booking-service:
    environment:
      BOOKING_PAYMENT_STORAGE_OWNER: ${BOOKING_PAYMENT_STORAGE_OWNER:-legacy}
      BOOKING_TMN_CODE: ""
      BOOKING_HASH_SECRET: ""
  booking-migrate:
    environment:
      BOOKING_PAYMENT_STORAGE_OWNER: ${BOOKING_PAYMENT_STORAGE_OWNER:-legacy}
      BOOKING_TMN_CODE: ""
      BOOKING_HASH_SECRET: ""
  booking-payment-consumer:
    build:
      context: ..
      dockerfile: services/booking-service/Dockerfile
    environment:
      BOOKING_DATABASE_URL: postgresql+psycopg2://booking_owner:${BOOKING_DB_PASSWORD}@booking-db:5432/cinema_booking
      BOOKING_PAYMENT_STORAGE_OWNER: ${BOOKING_PAYMENT_STORAGE_OWNER:-legacy}
      BOOKING_WRITES_ENABLED: ${BOOKING_WRITES_ENABLED:-false}
      BOOKING_AMQP_PAYMENT_CONSUMER_URL: amqp://booking-saga-consumer:${BROKER_BOOKING_CONSUMER_PASSWORD}@rabbitmq:5672/%2Fcinema-public
    command: ["python", "-m", "booking_service.payment_consumer"]
    depends_on:
      booking-service: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [backend]
  payment-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: payment_owner
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Run prepare_messaging.py}
      POSTGRES_DB: cinema_payment
    volumes: [paymentdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_owner -d cinema_payment"]
      interval: 3s
      timeout: 3s
      retries: 20
  payment-migrate:
    build: &payment-build
      context: ..
      dockerfile: services/payment-service/Dockerfile
    environment: &payment-env
      PAYMENT_DATABASE_URL: postgresql+psycopg2://payment_owner:${PAYMENT_DB_PASSWORD}@payment-db:5432/cinema_payment
      PAYMENT_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      PAYMENT_IDENTITY_ORIGIN: http://identity-service:8084
      PAYMENT_BOOKING_ORIGIN: http://booking-service:8087
      PAYMENT_WRITES_ENABLED: ${PAYMENT_WRITES_ENABLED:-false}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      payment-db: {condition: service_healthy}
    networks: [backend]
  payment-service:
    build: *payment-build
    environment:
      <<: *payment-env
      PAYMENT_FRONTEND_URL: ${BOOKING_FRONTEND_URL:-http://localhost:5173}
      PAYMENT_TMN_CODE: ${BOOKING_TMN_CODE:-}
      PAYMENT_HASH_SECRET: ${BOOKING_HASH_SECRET:-}
      PAYMENT_VNPAY_URL: ${BOOKING_VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    ports: ["127.0.0.1:8088:8088"]
    depends_on:
      payment-migrate: {condition: service_completed_successfully}
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/ready', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 5
  payment-worker:
    build: *payment-build
    environment:
      <<: *payment-env
      PAYMENT_AMQP_CONSUMER_URL: amqp://payment-saga:${BROKER_PAYMENT_PASSWORD}@rabbitmq:5672/%2Fcinema-public
    command: ["python", "-m", "payment_service.worker"]
    depends_on:
      payment-service: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [backend]
  payment-relay:
    build: *payment-build
    environment:
      PAYMENT_DATABASE_URL: postgresql+psycopg2://payment_owner:${PAYMENT_DB_PASSWORD}@payment-db:5432/cinema_payment
      PAYMENT_WRITES_ENABLED: ${PAYMENT_WRITES_ENABLED:-false}
      PAYMENT_AMQP_PUBLIC_URL: amqp://payment-saga:${BROKER_PAYMENT_PASSWORD}@rabbitmq:5672/%2Fcinema-public
    command: ["python", "-m", "payment_service.relay"]
    depends_on:
      payment-service: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [backend]
  payment-backfill:
    build: *payment-build
    profiles: [migration]
    environment:
      <<: *payment-env
      PAYMENT_SOURCE_DATABASE_URL: postgresql+psycopg2://booking_owner:${BOOKING_DB_PASSWORD}@booking-db:5432/cinema_booking
    command: ["python", "-m", "payment_service.migrate", "--apply", "--manifest", "/migration-manifests/latest.json"]
    volumes: ["../tmp/payment-migration:/migration-manifests"]
    depends_on:
      booking-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
    networks: [backend]
volumes:
  paymentdata:
