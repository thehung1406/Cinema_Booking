      timeout: 8s
    networks:
      backend: null
    ports:
    - host_ip: 127.0.0.1
      mode: ingress
      protocol: tcp
      published: '8085'
      target: 8085
    image: cinema-catalog:local
    restart: unless-stopped
  cinema-db:
    environment:
      POSTGRES_DB: cinema_cinema
      POSTGRES_PASSWORD: ${CINEMA_DB_PASSWORD:?Run prepare_messaging.py}
      POSTGRES_USER: cinema_owner
    healthcheck:
      interval: 3s
      retries: 20
      test:
      - CMD-SHELL
      - pg_isready -U cinema_owner -d cinema_cinema
      timeout: 3s
    image: postgres:15-alpine
    networks:
      backend: null
    volumes:
    - source: cinemadata
      target: /var/lib/postgresql/data
      type: volume
      volume: {}
    restart: unless-stopped
  cinema-migrate:
    build:
      context: .
      dockerfile: services/cinema-service/Dockerfile
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      cinema-db:
        condition: service_healthy
        required: true
    environment:
      CINEMA_BOOKING_ORIGIN: http://booking-service:8087
      CINEMA_CATALOG_ORIGIN: http://catalog-service:8085
      CINEMA_DATABASE_URL: postgresql+psycopg2://cinema_owner:${CINEMA_DB_PASSWORD}@cinema-db:5432/cinema_cinema
      CINEMA_IDENTITY_ORIGIN: http://identity-service:8084
      CINEMA_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      CINEMA_WRITES_ENABLED: ${CINEMA_WRITES_ENABLED:-false}
    networks:
      backend: null
    image: cinema-cinema:local
  cinema-service:
    build:
      context: .
      dockerfile: services/cinema-service/Dockerfile
    depends_on:
      cinema-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      CINEMA_BOOKING_ORIGIN: http://booking-service:8087
      CINEMA_CATALOG_ORIGIN: http://catalog-service:8085
      CINEMA_DATABASE_URL: postgresql+psycopg2://cinema_owner:${CINEMA_DB_PASSWORD}@cinema-db:5432/cinema_cinema
      CINEMA_IDENTITY_ORIGIN: http://identity-service:8084
      CINEMA_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      CINEMA_WRITES_ENABLED: ${CINEMA_WRITES_ENABLED:-false}
