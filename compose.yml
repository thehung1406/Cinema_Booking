      dockerfile: services/notification-service/Dockerfile
    command:
    - python
    - -m
    - notification_service.worker
    - dispatch
    depends_on:
      mailpit:
        condition: service_started
        required: true
      notification-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      NOTIFICATION_DATABASE_URL: postgresql+psycopg2://notification_owner:${NOTIFICATION_DB_PASSWORD}@notification-db:5432/cinema_notification
      NOTIFICATION_IDENTITY_ORIGIN: http://identity-service:8084
      NOTIFICATION_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      NOTIFICATION_SMTP_HOST: ${NOTIFICATION_SMTP_HOST:-mailpit}
      NOTIFICATION_SMTP_PORT: ${NOTIFICATION_SMTP_PORT:-1025}
      NOTIFICATION_SMTP_TLS: ${NOTIFICATION_SMTP_TLS:-false}
      NOTIFICATION_SMTP_USER: ${NOTIFICATION_SMTP_USER:-}
      NOTIFICATION_SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD:-}
    networks:
      backend: null
    restart: unless-stopped
    image: cinema-notification:local
  notification-migrate:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      notification-db:
        condition: service_healthy
        required: true
    environment:
      NOTIFICATION_DATABASE_URL: postgresql+psycopg2://notification_owner:${NOTIFICATION_DB_PASSWORD}@notification-db:5432/cinema_notification
      NOTIFICATION_IDENTITY_ORIGIN: http://identity-service:8084
      NOTIFICATION_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    networks:
      backend: null
    image: cinema-notification:local
  payment-db:
    environment:
      POSTGRES_DB: cinema_payment
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Run prepare_messaging.py}
      POSTGRES_USER: payment_owner
    healthcheck:
      interval: 3s
      retries: 20
      test:
      - CMD-SHELL
      - pg_isready -U payment_owner -d cinema_payment
      timeout: 3s
    image: postgres:15-alpine
    networks:
      backend: null
    volumes:
    - source: paymentdata
      target: /var/lib/postgresql/data
      type: volume
      volume: {}
    restart: unless-stopped
  payment-migrate:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      payment-db:
        condition: service_healthy
        required: true
    environment:
      PAYMENT_BOOKING_ORIGIN: http://booking-service:8087
      PAYMENT_DATABASE_URL: postgresql+psycopg2://payment_owner:${PAYMENT_DB_PASSWORD}@payment-db:5432/cinema_payment
      PAYMENT_IDENTITY_ORIGIN: http://identity-service:8084
      PAYMENT_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      PAYMENT_WRITES_ENABLED: ${PAYMENT_WRITES_ENABLED:-false}
    networks:
      backend: null
    image: cinema-payment:local
  payment-relay:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    command:
    - python
    - -m
    - payment_service.relay
    depends_on:
      payment-service:
        condition: service_healthy
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
    environment:
      PAYMENT_AMQP_PUBLIC_URL: amqp://payment-saga:${BROKER_PAYMENT_PASSWORD}@rabbitmq:5672/%2Fcinema-public
      PAYMENT_DATABASE_URL: postgresql+psycopg2://payment_owner:${PAYMENT_DB_PASSWORD}@payment-db:5432/cinema_payment
      PAYMENT_WRITES_ENABLED: ${PAYMENT_WRITES_ENABLED:-false}
    networks:
      backend: null
    image: cinema-payment:local
    restart: unless-stopped
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      PAYMENT_BOOKING_ORIGIN: http://booking-service:8087
      PAYMENT_DATABASE_URL: postgresql+psycopg2://payment_owner:${PAYMENT_DB_PASSWORD}@payment-db:5432/cinema_payment
      PAYMENT_FRONTEND_URL: ${PAYMENT_FRONTEND_URL:-http://localhost:5173}
      PAYMENT_HASH_SECRET: ${PAYMENT_HASH_SECRET:-}
      PAYMENT_IDENTITY_ORIGIN: http://identity-service:8084
      PAYMENT_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      PAYMENT_TMN_CODE: ${PAYMENT_TMN_CODE:-}
      PAYMENT_VNPAY_URL: ${PAYMENT_VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      PAYMENT_WRITES_ENABLED: ${PAYMENT_WRITES_ENABLED:-false}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/ready',
        timeout=5)
      timeout: 8s
    networks:
      backend: null
    ports:
    - host_ip: 127.0.0.1
      mode: ingress
      protocol: tcp
      published: '8088'
      target: 8088
    image: cinema-payment:local
    restart: unless-stopped
  payment-worker:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    command:
    - python
    - -m
    - payment_service.worker
    depends_on:
      payment-service:
        condition: service_healthy
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
    environment:
      PAYMENT_AMQP_CONSUMER_URL: amqp://payment-saga:${BROKER_PAYMENT_PASSWORD}@rabbitmq:5672/%2Fcinema-public
      PAYMENT_BOOKING_ORIGIN: http://booking-service:8087
      PAYMENT_DATABASE_URL: postgresql+psycopg2://payment_owner:${PAYMENT_DB_PASSWORD}@payment-db:5432/cinema_payment
      PAYMENT_IDENTITY_ORIGIN: http://identity-service:8084
      PAYMENT_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      PAYMENT_WRITES_ENABLED: ${PAYMENT_WRITES_ENABLED:-false}
    networks:
      backend: null
    image: cinema-payment:local
    restart: unless-stopped
  review-db:
    environment:
      POSTGRES_DB: cinema_review
      POSTGRES_PASSWORD: ${REVIEW_DB_PASSWORD:?Run prepare_messaging.py}
      POSTGRES_USER: review_owner
    healthcheck:
      interval: 3s
      retries: 20
      test:
      - CMD-SHELL
      - pg_isready -U review_owner -d cinema_review
      timeout: 3s
    image: postgres:15-alpine
    networks:
      backend: null
    volumes:
    - source: reviewdata
      target: /var/lib/postgresql/data
      type: volume
      volume: {}
    restart: unless-stopped
  review-migrate:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
      target: api
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      review-db:
        condition: service_healthy
        required: true
    environment:
      REVIEW_AUTO_APPROVE: ${REVIEW_AUTO_APPROVE:-false}
      REVIEW_DATABASE_URL: postgresql+psycopg2://review_owner:${REVIEW_DB_PASSWORD}@review-db:5432/cinema_review
      REVIEW_IDENTITY_ORIGIN: http://identity-service:8084
      REVIEW_SENTIMENT_BACKEND: ${REVIEW_SENTIMENT_BACKEND:-disabled}
      REVIEW_SENTIMENT_MIN_REVIEWS: ${REVIEW_SENTIMENT_MIN_REVIEWS:-10}
      REVIEW_SENTIMENT_MODEL_PATH: /models/sentiment
      REVIEW_SENTIMENT_REVIEW_THRESHOLD: ${REVIEW_SENTIMENT_REVIEW_THRESHOLD:-0.65}
      REVIEW_SENTIMENT_WINDOW_DAYS: ${REVIEW_SENTIMENT_WINDOW_DAYS:-30}
      REVIEW_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      REVIEW_WRITES_ENABLED: ${REVIEW_WRITES_ENABLED:-false}
    networks:
      backend: null
    image: cinema-review:local
  review-relay:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
      target: api
    command:
    - python
    - -m
    - review_service.relay
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: true
      review-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      REVIEW_AMQP_PUBLIC_URL: amqp://review-publisher:${BROKER_REVIEW_PASSWORD}@rabbitmq:5672/%2Fcinema-public
      REVIEW_DATABASE_URL: postgresql+psycopg2://review_owner:${REVIEW_DB_PASSWORD}@review-db:5432/cinema_review
      REVIEW_WRITES_ENABLED: ${REVIEW_WRITES_ENABLED:-false}
    networks:
      backend: null
    image: cinema-review:local
    restart: unless-stopped
  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
      target: api
    depends_on:
      review-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      REVIEW_AUTO_APPROVE: ${REVIEW_AUTO_APPROVE:-false}
      REVIEW_DATABASE_URL: postgresql+psycopg2://review_owner:${REVIEW_DB_PASSWORD}@review-db:5432/cinema_review
      REVIEW_IDENTITY_ORIGIN: http://identity-service:8084
      REVIEW_SENTIMENT_BACKEND: ${REVIEW_SENTIMENT_BACKEND:-disabled}
      REVIEW_SENTIMENT_MIN_REVIEWS: ${REVIEW_SENTIMENT_MIN_REVIEWS:-10}
      REVIEW_SENTIMENT_MODEL_PATH: /models/sentiment
      REVIEW_SENTIMENT_REVIEW_THRESHOLD: ${REVIEW_SENTIMENT_REVIEW_THRESHOLD:-0.65}
      REVIEW_SENTIMENT_WINDOW_DAYS: ${REVIEW_SENTIMENT_WINDOW_DAYS:-30}
      REVIEW_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      REVIEW_WRITES_ENABLED: ${REVIEW_WRITES_ENABLED:-false}
      REVIEW_DIRECT_READS_ENABLED: 'true'
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health/ready',
        timeout=5)
      timeout: 8s
    networks:
      backend: null
    ports:
    - host_ip: 127.0.0.1
      mode: ingress
      protocol: tcp
      published: '8083'
      target: 8083
    image: cinema-review:local
    restart: unless-stopped
  review-worker:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
      target: worker
    cpus: 1
    depends_on:
      review-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      REVIEW_DATABASE_URL: postgresql+psycopg2://review_owner:${REVIEW_DB_PASSWORD}@review-db:5432/cinema_review
      REVIEW_SENTIMENT_BACKEND: ${REVIEW_SENTIMENT_BACKEND:-disabled}
      REVIEW_SENTIMENT_MODEL_PATH: /models/sentiment
      REVIEW_SENTIMENT_REVIEW_THRESHOLD: ${REVIEW_SENTIMENT_REVIEW_THRESHOLD:-0.65}
      REVIEW_WRITES_ENABLED: ${REVIEW_WRITES_ENABLED:-false}
    mem_limit: 1g
    networks:
      backend: null
    volumes:
    - bind:
        create_host_path: true
      read_only: true
      source: ./model-store
      target: /models
      type: bind
    image: cinema-review-worker:local
    restart: unless-stopped
  reporting-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: reporting_owner
      POSTGRES_PASSWORD: ${REPORTING_DB_PASSWORD:?Run prepare_messaging.py}
      POSTGRES_DB: cinema_reporting
    volumes:
    - reportingdata:/var/lib/postgresql/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U reporting_owner -d cinema_reporting
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  reporting-migrate:
    build: &id001
      context: .
      dockerfile: services/reporting-service/Dockerfile
    image: cinema-reporting:local
    environment: &id002
      REPORTING_DATABASE_URL: postgresql+psycopg2://reporting_owner:${REPORTING_DB_PASSWORD}@reporting-db:5432/cinema_reporting
      REPORTING_IDENTITY_ORIGIN: http://identity-service:8084
      REPORTING_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      REPORTING_WRITES_ENABLED: ${REPORTING_WRITES_ENABLED:-false}
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      reporting-db:
        condition: service_healthy
    networks:
    - backend
  reporting-service:
    build: *id001
    image: cinema-reporting:local
    environment: *id002
    ports:
    - 127.0.0.1:8089:8089
    depends_on:
      reporting-migrate:
        condition: service_completed_successfully
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health/ready',timeout=5)
      interval: 10s
      timeout: 8s
      retries: 5
    restart: unless-stopped
  reporting-worker:
    build: *id001
    image: cinema-reporting:local
    environment:
      REPORTING_DATABASE_URL: postgresql+psycopg2://reporting_owner:${REPORTING_DB_PASSWORD}@reporting-db:5432/cinema_reporting
      REPORTING_IDENTITY_ORIGIN: http://identity-service:8084
      REPORTING_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      REPORTING_WRITES_ENABLED: ${REPORTING_WRITES_ENABLED:-false}
      REPORTING_AMQP_URL: amqp://reporting-consumer:${BROKER_REPORTING_PASSWORD}@rabbitmq:5672/%2Fcinema-public
    command:
    - python
    - -m
    - reporting_service.worker
    depends_on:
      reporting-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - backend
    restart: unless-stopped
  reporting-bootstrap:
    build: *id001
    image: cinema-reporting:local
    profiles:
    - migration
    environment: *id002
    command:
    - python
    - -m
    - reporting_service.bootstrap
    networks:
    - backend
  booking-report-source:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    image: cinema-booking:local
    environment:
      REPORT_SOURCE_DATABASE_URL: postgresql+psycopg2://booking_owner:${BOOKING_DB_PASSWORD}@booking-db:5432/cinema_booking
      REPORT_SOURCE_AMQP_URL: amqp://reporting-publisher-booking:${BROKER_REPORTING_BOOKING_PASSWORD}@rabbitmq:5672/%2Fcinema-public
    command:
    - python
    - -m
    - cinema_platform.reporting
    - --source
    - booking
    depends_on:
      booking-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - backend
    restart: unless-stopped
  payment-report-source:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    image: cinema-payment:local
    environment:
      REPORT_SOURCE_DATABASE_URL: postgresql+psycopg2://payment_owner:${PAYMENT_DB_PASSWORD}@payment-db:5432/cinema_payment
      REPORT_SOURCE_AMQP_URL: amqp://reporting-publisher-payment:${BROKER_REPORTING_PAYMENT_PASSWORD}@rabbitmq:5672/%2Fcinema-public
    command:
    - python
    - -m
    - cinema_platform.reporting
    - --source
    - payment
    depends_on:
      payment-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - backend
    restart: unless-stopped
  catalog-report-source:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    image: cinema-catalog:local
    environment:
      REPORT_SOURCE_DATABASE_URL: postgresql+psycopg2://catalog_owner:${CATALOG_DB_PASSWORD}@catalog-db:5432/cinema_catalog
      REPORT_SOURCE_AMQP_URL: amqp://reporting-publisher-catalog:${BROKER_REPORTING_CATALOG_PASSWORD}@rabbitmq:5672/%2Fcinema-public
    command:
    - python
    - -m
    - cinema_platform.reporting
    - --source
    - catalog
    depends_on:
      catalog-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - backend
    restart: unless-stopped
  cinema-report-source:
    build:
      context: .
      dockerfile: services/cinema-service/Dockerfile
    image: cinema-cinema:local
    environment:
      REPORT_SOURCE_DATABASE_URL: postgresql+psycopg2://cinema_owner:${CINEMA_DB_PASSWORD}@cinema-db:5432/cinema_cinema
      REPORT_SOURCE_AMQP_URL: amqp://reporting-publisher-cinema:${BROKER_REPORTING_CINEMA_PASSWORD}@rabbitmq:5672/%2Fcinema-public
    command:
    - python
    - -m
    - cinema_platform.reporting
    - --source
    - cinema
    depends_on:
      cinema-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - backend
    restart: unless-stopped
  review-report-source:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
      target: api
    image: cinema-review:local
    environment:
      REPORT_SOURCE_DATABASE_URL: postgresql+psycopg2://review_owner:${REVIEW_DB_PASSWORD}@review-db:5432/cinema_review
      REPORT_SOURCE_AMQP_URL: amqp://reporting-publisher-review:${BROKER_REPORTING_REVIEW_PASSWORD}@rabbitmq:5672/%2Fcinema-public
    command:
    - python
    - -m
    - cinema_platform.reporting
    - --source
    - review
    depends_on:
      review-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - backend
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: cinema-web:local
    ports:
    - 127.0.0.1:5173:80
    depends_on:
      gateway:
        condition: service_healthy
    networks:
    - backend
    restart: unless-stopped
networks:
  backend:
    driver: bridge
    name: backend_backend
volumes:
  aidata:
    name: backend_aidata
  bookingdata:
    name: backend_bookingdata
  catalogdata:
    name: backend_catalogdata
  cinemadata:
    name: backend_cinemadata
  identitydata:
    name: backend_identitydata
  notificationdata:
    name: backend_notificationdata
  paymentdata:
    name: backend_paymentdata
  rabbitdata:
    name: backend_rabbitdata
  reviewdata:
    name: backend_reviewdata
  reportingdata:
    name: backend_reportingdata
