      IDENTITY_CURRENT_KID: ${IDENTITY_CURRENT_KID}
      IDENTITY_DATABASE_URL: postgresql+psycopg2://identity_owner:${IDENTITY_DB_PASSWORD}@identity-db:5432/cinema_identity
