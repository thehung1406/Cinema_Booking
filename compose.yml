      CATALOG_IDENTITY_ORIGIN: http://identity-service:8084
      CATALOG_QUOTE_SECONDS: ${CATALOG_QUOTE_SECONDS:-120}
      CATALOG_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
