# Final runtime. Archives and legacy jobs are offline; see docs/runbooks/final-runtime.md.
name: backend
services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on: {}
    environment:
      GATEWAY_ENABLED_DOMAINS: '["ai", "review", "identity", "catalog", "cinema",
        "booking", "payment", "reporting"]'
      GATEWAY_UPSTREAMS: '{"ai": "http://ai-service:8082", "review": "http://review-service:8083",
        "identity": "http://identity-service:8084", "catalog": "http://catalog-service:8085",
        "cinema": "http://cinema-service:8086", "booking": "http://booking-service:8087",
        "payment": "http://payment-service:8088", "reporting": "http://reporting-service:8089"}'
      GATEWAY_REQUIRED_DOMAINS: '["identity","booking","payment","reporting"]'
      GATEWAY_LEGACY_ENABLED: 'false'
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready',
        timeout=5)
      timeout: 8s
    networks:
      backend: null
    ports:
    - host_ip: 127.0.0.1
      mode: ingress
      protocol: tcp
      published: '8080'
      target: 8080
    image: cinema-gateway:local
    restart: unless-stopped
  rabbitmq:
    healthcheck:
      interval: 5s
      retries: 30
      start_period: 20s
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      timeout: 5s
    hostname: cinema-rabbitmq
    image: rabbitmq:4.1-management
    networks:
      backend: null
    volumes:
    - bind:
        create_host_path: true
      read_only: true
      source: ./infra/broker/rabbitmq.conf
      target: /etc/rabbitmq/rabbitmq.conf
      type: bind
    - bind:
        create_host_path: true
      read_only: true
      source: ./infra/broker/.runtime/definitions.json
      target: /etc/rabbitmq/definitions.json
      type: bind
    - source: rabbitdata
      target: /var/lib/rabbitmq
      type: volume
      volume: {}
    environment: {}
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.24
    networks:
      backend: null
    ports:
    - host_ip: 127.0.0.1
      mode: ingress
      protocol: tcp
      published: '8025'
      target: 8025
    environment: {}
    restart: unless-stopped
  ai-redis:
    healthcheck:
      interval: 3s
      retries: 20
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 3s
    image: redis:7-alpine
    networks:
      backend: null
    environment: {}
    restart: unless-stopped
  ai-db:
    environment:
      POSTGRES_DB: cinema_ai
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:?Run prepare_messaging.py}
      POSTGRES_USER: ai_owner
    healthcheck:
      interval: 3s
      retries: 20
      test:
      - CMD-SHELL
      - pg_isready -U ai_owner -d cinema_ai
      timeout: 3s
    image: postgres:15-alpine
    networks:
      backend: null
    volumes:
    - source: aidata
      target: /var/lib/postgresql/data
      type: volume
      volume: {}
    restart: unless-stopped
  ai-migrate:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      ai-db:
        condition: service_healthy
        required: true
    environment:
      AI_CONTEXT_TTL_SECONDS: ${AI_CONTEXT_TTL_SECONDS:-1800}
      AI_DATABASE_URL: postgresql+psycopg2://ai_owner:${AI_DB_PASSWORD}@ai-db:5432/cinema_ai
      AI_IDENTITY_ORIGIN: http://identity-service:8084
      AI_MODEL_TIMEOUT_SECONDS: ${AI_MODEL_TIMEOUT_SECONDS:-15}
      AI_MODEL_URL: ${AI_MODEL_URL:-}
      AI_REDIS_URL: redis://ai-redis:6379/0
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-10}
      AI_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      AI_WRITES_ENABLED: ${AI_WRITES_ENABLED:-false}
    networks:
      backend: null
    image: cinema-ai:local
  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
        required: true
      ai-redis:
        condition: service_healthy
        required: true
    environment:
      AI_CONTEXT_TTL_SECONDS: ${AI_CONTEXT_TTL_SECONDS:-1800}
      AI_DATABASE_URL: postgresql+psycopg2://ai_owner:${AI_DB_PASSWORD}@ai-db:5432/cinema_ai
      AI_IDENTITY_ORIGIN: http://identity-service:8084
      AI_MODEL_TIMEOUT_SECONDS: ${AI_MODEL_TIMEOUT_SECONDS:-15}
      AI_MODEL_URL: ${AI_MODEL_URL:-}
      AI_REDIS_URL: redis://ai-redis:6379/0
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-10}
      AI_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      AI_WRITES_ENABLED: ${AI_WRITES_ENABLED:-false}
      AI_DIRECT_READS_ENABLED: 'true'
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health/ready',
        timeout=5)
      timeout: 8s
    networks:
      backend: null
    ports:
    - host_ip: 127.0.0.1
      mode: ingress
      protocol: tcp
      published: '8082'
      target: 8082
    image: cinema-ai:local
    restart: unless-stopped
  booking-db:
    environment:
      POSTGRES_DB: cinema_booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:?Run prepare_messaging.py}
      POSTGRES_USER: booking_owner
    healthcheck:
      interval: 3s
      retries: 20
      test:
      - CMD-SHELL
      - pg_isready -U booking_owner -d cinema_booking
      timeout: 3s
    image: postgres:15-alpine
    networks:
      backend: null
    volumes:
    - source: bookingdata
      target: /var/lib/postgresql/data
      type: volume
      volume: {}
    restart: unless-stopped
  booking-migrate:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    command:
    - python
    - -m
    - booking_service.initialize
    depends_on:
      booking-db:
        condition: service_healthy
        required: true
    environment:
      BOOKING_CATALOG_ORIGIN: http://catalog-service:8085
      BOOKING_DATABASE_URL: postgresql+psycopg2://booking_owner:${BOOKING_DB_PASSWORD}@booking-db:5432/cinema_booking
      BOOKING_IDENTITY_ORIGIN: http://identity-service:8084
      BOOKING_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      BOOKING_WRITES_ENABLED: ${BOOKING_WRITES_ENABLED:-false}
      BOOKING_PAYMENT_STORAGE_OWNER: service
    networks:
      backend: null
    image: cinema-booking:local
  booking-payment-consumer:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    command:
    - python
    - -m
    - booking_service.payment_consumer
    depends_on:
      booking-service:
        condition: service_healthy
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
    environment:
      BOOKING_AMQP_PAYMENT_CONSUMER_URL: amqp://booking-saga-consumer:${BROKER_BOOKING_CONSUMER_PASSWORD}@rabbitmq:5672/%2Fcinema-public
      BOOKING_DATABASE_URL: postgresql+psycopg2://booking_owner:${BOOKING_DB_PASSWORD}@booking-db:5432/cinema_booking
      BOOKING_PAYMENT_STORAGE_OWNER: service
      BOOKING_WRITES_ENABLED: ${BOOKING_WRITES_ENABLED:-false}
    networks:
      backend: null
    image: cinema-booking:local
    restart: unless-stopped
  booking-relay:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    command:
    - python
    - -m
    - booking_service.relay
    depends_on:
      booking-service:
        condition: service_healthy
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
    environment:
      BOOKING_AMQP_NOTIFICATION_URL: amqp://booking-publisher:${BROKER_PUBLISHER_PASSWORD}@rabbitmq:5672/%2Fcinema-private
      BOOKING_AMQP_PUBLIC_URL: amqp://booking-publisher:${BROKER_PUBLISHER_PASSWORD}@rabbitmq:5672/%2Fcinema-public
      BOOKING_DATABASE_URL: postgresql+psycopg2://booking_owner:${BOOKING_DB_PASSWORD}@booking-db:5432/cinema_booking
      BOOKING_WRITES_ENABLED: ${BOOKING_WRITES_ENABLED:-false}
    networks:
      backend: null
    image: cinema-booking:local
    restart: unless-stopped
  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      BOOKING_CATALOG_ORIGIN: http://catalog-service:8085
      BOOKING_DATABASE_URL: postgresql+psycopg2://booking_owner:${BOOKING_DB_PASSWORD}@booking-db:5432/cinema_booking
      BOOKING_IDENTITY_ORIGIN: http://identity-service:8084
      BOOKING_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      BOOKING_WRITES_ENABLED: ${BOOKING_WRITES_ENABLED:-false}
