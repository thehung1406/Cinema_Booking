      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/health/ready',
        timeout=5)
      timeout: 8s
    networks:
      backend: null
    ports:
    - host_ip: 127.0.0.1
      mode: ingress
      protocol: tcp
      published: '8087'
      target: 8087
    image: cinema-booking:local
    restart: unless-stopped
  booking-worker:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    command:
    - python
    - -m
    - booking_service.worker
    depends_on:
      booking-service:
        condition: service_healthy
        required: true
    environment:
      BOOKING_DATABASE_URL: postgresql+psycopg2://booking_owner:${BOOKING_DB_PASSWORD}@booking-db:5432/cinema_booking
      BOOKING_WRITES_ENABLED: ${BOOKING_WRITES_ENABLED:-false}
    networks:
