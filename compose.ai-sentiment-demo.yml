# Compare the two trusted pilot artifacts through the authenticated sentiment demo API.
services:
  review-service:
    image: cinema-review:sentiment-demo
    build:
      target: sentiment-demo
    environment:
      REVIEW_SENTIMENT_DEMO_LR_PATH: /models/demo/lr
      REVIEW_SENTIMENT_DEMO_VISOBERT_PATH: /models/demo/visobert
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    volumes:
      - ${REVIEW_DEMO_LR_ARTIFACT:-./pipelines/models/sentiment-demo/lr}:/models/demo/lr:ro
      - ${REVIEW_DEMO_VISOBERT_ARTIFACT:-./pipelines/models/sentiment-demo/visobert}:/models/demo/visobert:ro
  review-worker:
    image: cinema-review:sentiment-demo
    build:
      target: sentiment-demo
    command: ["python", "-m", "review_service.worker"]
    mem_limit: 2g
    environment:
      REVIEW_SENTIMENT_BACKEND: sklearn
      REVIEW_SENTIMENT_MODEL_PATH: /models
      REVIEW_SENTIMENT_FALLBACK_BACKEND: transformers
      REVIEW_SENTIMENT_FALLBACK_MODEL_PATH: /opt/demo-visobert
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    volumes:
      - ${REVIEW_DEMO_LR_ARTIFACT:-./pipelines/models/sentiment-demo/lr}:/models:ro
      - ${REVIEW_DEMO_VISOBERT_ARTIFACT:-./pipelines/models/sentiment-demo/visobert}:/opt/demo-visobert:ro
