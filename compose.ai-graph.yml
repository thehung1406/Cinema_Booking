# Merge with compose.yml to enable graph reads, or start just neo4j for offline evaluation.
services:
  ai-service:
    environment:
      AI_GRAPH_URI: bolt://neo4j:7687
      AI_GRAPH_PASSWORD: ${AI_GRAPH_PASSWORD:-}
      AI_GRAPH_RELEASE_ID: ${AI_GRAPH_RELEASE_ID:-}
      AI_RETRIEVAL_STRATEGY: ${AI_GRAPH_RETRIEVAL_STRATEGY:-bm25}
    depends_on:
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:5.26-community@sha256:577eb43120e8688e62e753e962c47d30044ecaa95147ee5386c29f226b878008
    environment:
      NEO4J_AUTH: neo4j/${AI_GRAPH_PASSWORD:-}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - '127.0.0.1:${AI_GRAPH_HTTP_PORT:-17474}:7474'
      - '127.0.0.1:${AI_GRAPH_BOLT_PORT:-17687}:7687'
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1"']
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ai-graph-data:/data
    networks: [backend]
volumes:
  ai-graph-data:
