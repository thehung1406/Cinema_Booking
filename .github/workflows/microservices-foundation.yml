name: Microservices foundation

on:
  push:
    paths:
      - 'gateway/**'
      - 'packages/**'
      - 'services/**'
      - 'scripts/dev/**'
      - 'Backend/**'
      - 'Frontend/**'
      - 'contracts/**'
      - 'scripts/migration/**'
      - 'tests/integration/**'
      - 'infra/compose/**'
      - 'infra/broker/**'
      - '.dockerignore'
      - 'docker-compose.microservices.yml'
      - 'docker-compose.notifications.yml'
      - 'docker-compose.ai-service.yml'
      - 'docker-compose.reviews.yml'
      - 'docker-compose.identity.yml'
      - 'docker-compose.catalog.yml'
      - 'docker-compose.cinema.yml'
      - 'docker-compose.booking.yml'
      - 'docker-compose.payment.yml'
      - '.github/workflows/microservices-foundation.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - 'packages/**'
      - 'services/**'
      - 'scripts/dev/**'
      - 'Backend/**'
      - 'Frontend/**'
      - 'contracts/**'
      - 'scripts/migration/**'
      - 'tests/integration/**'
      - 'infra/compose/**'
      - 'infra/broker/**'
      - '.dockerignore'
      - 'docker-compose.microservices.yml'
      - 'docker-compose.notifications.yml'
      - 'docker-compose.ai-service.yml'
      - 'docker-compose.reviews.yml'
      - 'docker-compose.identity.yml'
      - 'docker-compose.catalog.yml'
      - 'docker-compose.cinema.yml'
      - 'docker-compose.booking.yml'
      - 'docker-compose.payment.yml'
      - '.github/workflows/microservices-foundation.yml'

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r gateway/requirements-dev.txt
      - run: python -m pytest gateway/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL, Redis, gateway and monolith contracts
        run: |
          python scripts/dev/prepare_messaging.py --test
          docker compose -p cinema-migration-tests -f infra/compose/compose.migration-tests.yml run --build --rm backend-test
      - name: Verify exported source contract is current
        run: git diff --exit-code -- contracts docs/migration/schema-baseline.json docs/migration/import-baseline.json docs/migration/ai-owned-schema.json docs/migration/review-owned-schema.json docs/migration/identity-owned-schema.json docs/migration/catalog-owned-schema.json docs/migration/cinema-owned-schema.json docs/migration/booking-sales-owned-schema.json docs/migration/booking-owned-schema.json docs/migration/booking-payment-owned-schema.json docs/migration/payment-owned-schema.json
      - name: Build and verify the isolated Review ML worker image
        run: docker compose -p cinema-migration-tests -f infra/compose/compose.migration-tests.yml --profile verification run --build --rm review-inference-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microservices-regression-report
          path: tmp/microservices-tests.xml
      - name: Stop isolated test services
        if: always()
        run: docker compose -p cinema-migration-tests -f infra/compose/compose.migration-tests.yml down
