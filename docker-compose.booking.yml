# Ninth overlay. Booking and legacy payment share one transaction store.
services:
  fastapi:
    environment:
      BOOKING_STORAGE_OWNER: ${BOOKING_STORAGE_OWNER:-monolith}
      BOOKING_SERVICE_ORIGIN: http://booking-service:8087
  gateway:
    environment:
      GATEWAY_UPSTREAMS: '{"ai":"http://ai-service:8082","review":"http://review-service:8083","identity":"http://identity-service:8084","catalog":"http://catalog-service:8085","cinema":"http://cinema-service:8086","payment":"http://booking-service:8087","booking":"http://booking-service:8087"}'
      GATEWAY_ENABLED_DOMAINS: ${SERVICE_GATEWAY_DOMAINS:-[]}
      GATEWAY_REQUIRED_DOMAINS: ${SERVICE_GATEWAY_REQUIRED_DOMAINS:-[]}
  cinema-service:
    environment:
      CINEMA_BOOKING_ORIGIN: ${CINEMA_BOOKING_ORIGIN:-http://fastapi:8000}
  cinema-worker:
    environment:
      CINEMA_BOOKING_ORIGIN: ${CINEMA_BOOKING_ORIGIN:-http://fastapi:8000}
  celery_worker:
    environment:
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      BOOKING_STORAGE_OWNER: ${BOOKING_STORAGE_OWNER:-monolith}
      BOOKING_SERVICE_ORIGIN: http://booking-service:8087
  celery_beat:
    environment:
      BOOKING_STORAGE_OWNER: ${BOOKING_STORAGE_OWNER:-monolith}
  booking-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: booking_owner
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:?Run prepare_messaging.py}
      POSTGRES_DB: cinema_booking
    volumes: [bookingdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_owner -d cinema_booking"]
      interval: 3s
      timeout: 3s
      retries: 20
  booking-migrate:
    build: &booking-build
      context: ..
      dockerfile: services/booking-service/Dockerfile
    environment: &booking-env
      BOOKING_DATABASE_URL: postgresql+psycopg2://booking_owner:${BOOKING_DB_PASSWORD}@booking-db:5432/cinema_booking
      BOOKING_IDENTITY_ORIGIN: http://identity-service:8084
      BOOKING_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      BOOKING_WRITES_ENABLED: ${BOOKING_WRITES_ENABLED:-false}
      BOOKING_FRONTEND_URL: ${BOOKING_FRONTEND_URL:-http://localhost:5173}
      BOOKING_TMN_CODE: ${BOOKING_TMN_CODE:-}
      BOOKING_HASH_SECRET: ${BOOKING_HASH_SECRET:-}
      BOOKING_VNPAY_URL: ${BOOKING_VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      BOOKING_CATALOG_ORIGIN: http://catalog-service:8085
    command: ["alembic", "upgrade", "head"]
    depends_on:
      booking-db:
        condition: service_healthy
    networks: [backend]
  booking-service:
    build: *booking-build
    environment: *booking-env
    ports: ["127.0.0.1:8087:8087"]
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/health/ready', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 5
  booking-worker:
    build: *booking-build
    environment:
      BOOKING_DATABASE_URL: postgresql+psycopg2://booking_owner:${BOOKING_DB_PASSWORD}@booking-db:5432/cinema_booking
      BOOKING_WRITES_ENABLED: ${BOOKING_WRITES_ENABLED:-false}
    command: ["python", "-m", "booking_service.worker"]
    depends_on:
      booking-service:
        condition: service_healthy
    networks: [backend]
  booking-relay:
    build: *booking-build
    environment:
      BOOKING_DATABASE_URL: postgresql+psycopg2://booking_owner:${BOOKING_DB_PASSWORD}@booking-db:5432/cinema_booking
      BOOKING_WRITES_ENABLED: ${BOOKING_WRITES_ENABLED:-false}
      BOOKING_AMQP_PUBLIC_URL: amqp://booking-publisher:${BROKER_PUBLISHER_PASSWORD}@rabbitmq:5672/%2Fcinema-public
      BOOKING_AMQP_NOTIFICATION_URL: amqp://booking-publisher:${BROKER_PUBLISHER_PASSWORD}@rabbitmq:5672/%2Fcinema-private
    command: ["python", "-m", "booking_service.relay"]
    depends_on:
      booking-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]
  booking-backfill:
    build: *booking-build
    profiles: [migration]
    env_file: .env
    environment: *booking-env
    command: ["python", "-m", "booking_service.migrate", "--apply", "--manifest", "/migration-manifests/latest.json"]
    volumes: ["../tmp/booking-migration:/migration-manifests"]
    depends_on:
      booking-service:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    networks: [backend]
volumes:
  bookingdata:
