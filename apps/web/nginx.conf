server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location /api { proxy_pass http://gateway:8080; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 65s; }
    location / { try_files $uri $uri/ /index.html; }
    location = /health { access_log off; add_header Content-Type text/plain; return 200 'ready'; }
}
