# Portable AI development: CPU by default, no host-installed Ollama or CUDA.
# Merge with root compose.yml. Full production boot remains in final-runtime.md.
services:
  gateway:
    depends_on:
      identity-service: {condition: service_healthy}
      catalog-service: {condition: service_healthy}
      cinema-service: {condition: service_healthy}
      booking-service: {condition: service_healthy}
      review-service: {condition: service_healthy}
      ai-service: {condition: service_healthy}
    environment:
      GATEWAY_REQUIRED_DOMAINS: '["identity","catalog","cinema","booking","review","ai"]'
  ai-service:
    environment:
      AI_LLM_PROVIDER: ollama
      AI_LLM_BASE_URL: http://ollama:11434
      AI_LLM_MODEL: qwen3:4b
      AI_LLM_TIMEOUT_SECONDS: '20'
      AI_LLM_KEEP_ALIVE: 5m
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts/ai:/app/tools:ro
  ollama:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_NUM_PARALLEL: '1'
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]
    restart: unless-stopped
  ollama-init:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    image: cinema-ai:local
    command: [python, /bootstrap/bootstrap_chat_model.py, --origin, 'http://ollama:11434', --lock, /bootstrap/chat_runtime.lock.json]
    volumes:
      - ./scripts/ai/bootstrap_chat_model.py:/bootstrap/bootstrap_chat_model.py:ro
      - ./pipelines/configs/chat_runtime.lock.json:/bootstrap/chat_runtime.lock.json:ro
    depends_on:
      ollama:
        condition: service_healthy
    networks: [backend]
    restart: 'no'
volumes:
  ollama-models:
