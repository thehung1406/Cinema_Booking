# Add after the gateway and notification overlays; defaults keep legacy AI writer/routes.
services:
  fastapi:
    environment:
      AI_STORAGE_OWNER: ${AI_STORAGE_OWNER:-monolith}
  gateway:
    environment:
      GATEWAY_UPSTREAMS: '{"ai":"http://ai-service:8082"}'
      GATEWAY_ENABLED_DOMAINS: ${AI_GATEWAY_DOMAINS:-[]}
  ai-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ai_owner
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:?Run prepare_messaging.py}
      POSTGRES_DB: cinema_ai
    volumes: [aidata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_owner -d cinema_ai"]
      interval: 3s
      timeout: 3s
      retries: 20
  ai-redis:
    image: redis:7-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  ai-migrate:
    build:
      context: ..
      dockerfile: services/ai-service/Dockerfile
    environment: &ai-environment
      AI_DATABASE_URL: postgresql+psycopg2://ai_owner:${AI_DB_PASSWORD}@ai-db:5432/cinema_ai
      AI_REDIS_URL: redis://ai-redis:6379/0
      AI_IDENTITY_ORIGIN: http://fastapi:8000
      AI_READ_ORIGIN: http://fastapi:8000
      AI_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      AI_WRITES_ENABLED: ${AI_WRITES_ENABLED:-false}
      AI_MODEL_URL: ${AI_MODEL_URL:-}
      AI_MODEL_TIMEOUT_SECONDS: ${AI_MODEL_TIMEOUT_SECONDS:-15}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-10}
      AI_CONTEXT_TTL_SECONDS: ${AI_CONTEXT_TTL_SECONDS:-1800}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      ai-db:
        condition: service_healthy
    networks: [backend]
  ai-service:
    build:
      context: ..
      dockerfile: services/ai-service/Dockerfile
    environment: *ai-environment
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
      ai-redis:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health/ready', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 5
  ai-backfill:
    build:
      context: ..
      dockerfile: services/ai-service/Dockerfile
    profiles: [migration]
    env_file: .env
    environment: *ai-environment
    command: ["python", "-m", "ai_service.migrate", "--apply", "--manifest", "/migration-manifests/latest.json"]
    volumes: ["../tmp/ai-migration:/migration-manifests"]
    depends_on:
      ai-service:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    networks: [backend]

volumes:
  aidata:
