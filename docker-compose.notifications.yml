# Prepare: python scripts/dev/prepare_messaging.py
# Run from root with --env-file .env.microservices and the backend + gateway overlays.
services:
  fastapi:
    environment:
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Run prepare_messaging.py}
      NOTIFICATION_TRANSPORT: events
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASSWORD: ""
  celery_worker:
    environment:
      NOTIFICATION_TRANSPORT: events
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASSWORD: ""
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: cinema-rabbitmq
    volumes:
      - ../infra/broker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../infra/broker/.runtime/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitdata:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  notification-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: notification_owner
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Run prepare_messaging.py}
      POSTGRES_DB: cinema_notification
    volumes:
      - notificationdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_owner -d cinema_notification"]
      interval: 3s
      timeout: 3s
      retries: 20
  notification-migrate:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    environment: &notification-environment
      NOTIFICATION_DATABASE_URL: postgresql+psycopg2://notification_owner:${NOTIFICATION_DB_PASSWORD}@notification-db:5432/cinema_notification
      NOTIFICATION_AMQP_URL: amqp://notification-consumer:${BROKER_NOTIFICATION_PASSWORD}@rabbitmq:5672/%2Fcinema-private
      NOTIFICATION_IDENTITY_ORIGIN: http://fastapi:8000
      NOTIFICATION_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      NOTIFICATION_SMTP_HOST: mailpit
      NOTIFICATION_SMTP_PORT: "1025"
      NOTIFICATION_SMTP_TLS: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      notification-db:
        condition: service_healthy
    networks: [backend]
  notification-api:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    environment: *notification-environment
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  notification-consumer:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    environment: *notification-environment
    command: ["python", "-m", "notification_service.worker", "consume"]
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
  notification-dispatcher:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    environment: *notification-environment
    command: ["python", "-m", "notification_service.worker", "dispatch"]
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks: [backend]
    restart: unless-stopped
  outbox-relay:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:pass123@postgres:5432/BackendTTCS
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      AMQP_PUBLIC_URL: amqp://booking-publisher:${BROKER_PUBLISHER_PASSWORD}@rabbitmq:5672/%2Fcinema-public
      AMQP_NOTIFICATION_URL: amqp://booking-publisher:${BROKER_PUBLISHER_PASSWORD}@rabbitmq:5672/%2Fcinema-private
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    command: ["python", "-m", "app.worker.outbox_relay"]
    depends_on:
      fastapi:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["127.0.0.1:8025:8025"]
    networks: [backend]

volumes:
  rabbitdata:
  notificationdata:
